name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install validated parser snapshot + dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"
      - name: Lint (pyflakes correctness rules)
        run: ruff check .
      - name: Unit + contract tests
        run: python -m pytest tests/ -q -rs
        # corpus tests SKIP with LOCAL_CNMV_CORPUS_NOT_AVAILABLE —
        # visible in the -rs summary, never treated as a pass
      - name: Build demo dataset (determinism check)
        run: |
          python scripts/build_demo_dataset.py demo/ownership-radar-demo.sqlite
          python scripts/build_demo_dataset.py /tmp/demo-b.sqlite
      - name: Examples execute against demo
        run: |
          for f in examples/*.py; do
            if [ "$f" = "examples/issuer_holdings.py" ]; then
              python "$f" SAN demo/ownership-radar-demo.sqlite
            else
              python "$f" demo/ownership-radar-demo.sqlite
            fi
          done

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Audit package contents
        run: |
          tar -tzf dist/*.tar.gz | sort > /tmp/sdist-files.txt
          unzip -l dist/*.whl
          cat /tmp/sdist-files.txt
          ! grep -Ei '(\.sqlite|\.pdf|\.env|secret|token|passwd)' \
             /tmp/sdist-files.txt
      - name: Clean install + smoke outside checkout
        run: |
          python -m venv /tmp/venv-clean
          /tmp/venv-clean/bin/pip install -q dist/*.whl
          cd /tmp
          /tmp/venv-clean/bin/python -c "import ownership_radar; \
            print(ownership_radar.__version__)"
          /tmp/venv-clean/bin/python -c "from ownership_radar import \
            universe; u = universe.load_universe(); \
            assert len(u[1]) == 60; print(u[0]['universe_version'])"
          /tmp/venv-clean/bin/ownership-radar --help
          /tmp/venv-clean/bin/ownership-radar --version
